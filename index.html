<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHERIS // 3D AI BRAIN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      color: #f3f4f6;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .cyber-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 30%, transparent 40%, rgba(3, 7, 18, 0.85) 90%),
                  linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px) 0 0 / 24px 24px;
    }
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 10px 14px;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-dot {
      width: 8px;
      height: 8px;
      background: #00f2fe;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f2fe;
      animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .key-btn {
      font-size: 11px;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hud-footer {
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 14px;
      max-height: 45vh;
    }
    .greeting-bubble {
      font-size: 14px;
      font-weight: 500;
      color: #e0f2fe;
      background: rgba(8, 47, 73, 0.45);
      border-left: 3px solid #00f2fe;
      padding: 8px 12px;
      border-radius: 0 10px 10px 0;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }
    .greeting-bubble span.highlight {
      color: #38bdf8;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .waveform-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 16px;
      padding: 0 4px;
    }
    .wave-bar {
      width: 3px;
      height: 4px;
      background: #00f2fe;
      border-radius: 2px;
      transition: height 0.1s ease;
    }
    .active-listening .wave-bar {
      animation: waveDance 0.5s infinite alternate ease-in-out;
    }
    @keyframes waveDance {
      0% { height: 4px; }
      100% { height: 16px; background: #38bdf8; }
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-input {
      flex: 1;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 30px;
      padding: 10px 16px;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
    }
    .hud-input:focus {
      border-color: #00f2fe;
    }
    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 0 14px rgba(14, 165, 233, 0.4);
    }
    .action-btn:active {
      transform: scale(0.92);
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: micGlow 1s infinite alternate;
    }
    @keyframes micGlow {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div class="cyber-overlay"></div>
  <canvas id="webgl-canvas"></canvas>

  <div class="hud-header">
    <div class="hud-title">
      <div class="hud-dot"></div>
      AETHERIS // GEMINI-BRAIN
    </div>
    <button class="key-btn" onclick="promptApiKey()">🔑 SET API KEY</button>
  </div>

  <div class="hud-footer">
    <div class="greeting-bubble" id="dialogue-box">
      <span class="highlight">Hello Navneet</span>, what do you want?
    </div>

    <div class="waveform-wrap" id="wave-container">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="input-row">
      <input type="text" id="user-input" class="hud-input" placeholder="Kuch bhi bolo ya type karo..." />
      <button class="action-btn mic-btn" id="mic-btn" onclick="toggleMic()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button class="action-btn" onclick="sendText()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 3D ROBOT RIGGING (Three.js WebGL)
    ======================================================== */
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.12);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.8);

    const ambientLight = new THREE.AmbientLight(0x0e2a47, 1.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(2, 4, 3);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00f2fe, 3.0);
    rimLight.position.set(-3, 2, -2);
    scene.add(rimLight);

    const chestPointLight = new THREE.PointLight(0x00f2fe, 2.5, 3.5);
    scene.add(chestPointLight);

    const chassisMat = new THREE.MeshStandardMaterial({ color: 0xebf4ff, roughness: 0.25, metalness: 0.85 });
    const innerMechMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.6, metalness: 0.95 });
    const glowCyanMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

    const robot = new THREE.Group();
    robot.position.y = -0.4;
    scene.add(robot);

    const chestGeo = new THREE.CylinderGeometry(0.55, 0.4, 0.9, 16);
    const chest = new THREE.Mesh(chestGeo, chassisMat);
    chest.position.y = 1.0;
    robot.add(chest);

    const arcRingGeo = new THREE.TorusGeometry(0.16, 0.035, 16, 32);
    const arcRing = new THREE.Mesh(arcRingGeo, innerMechMat);
    arcRing.position.set(0, 1.15, 0.48);
    robot.add(arcRing);

    const arcCoreGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.05, 32);
    arcCoreGeo.rotateX(Math.PI / 2);
    const arcCore = new THREE.Mesh(arcCoreGeo, glowCyanMat);
    arcCore.position.set(0, 1.15, 0.48);
    robot.add(arcCore);
    chestPointLight.position.set(0, 0.8, 0.6);

    const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.6, 12), innerMechMat);
    spine.position.y = 0.35;
    robot.add(spine);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.16, 0.35, 12), innerMechMat);
    neck.position.y = 1.55;
    robot.add(neck);

    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.85, 0);
    robot.add(headGroup);

    const craniumGeo = new THREE.SphereGeometry(0.42, 32, 24);
    craniumGeo.scale(0.9, 1.15, 1.0);
    const cranium = new THREE.Mesh(craniumGeo, chassisMat);
    headGroup.add(cranium);

    const earGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 24);
    earGeo.rotateZ(Math.PI / 2);
    const leftEar = new THREE.Mesh(earGeo, chassisMat);
    leftEar.position.set(-0.4, 0, 0);
    const rightEar = new THREE.Mesh(earGeo, chassisMat);
    rightEar.position.set(0.4, 0, 0);
    headGroup.add(leftEar);
    headGroup.add(rightEar);

    const eyeGeo = new THREE.SphereGeometry(0.065, 16, 16);
    const leftEye = new THREE.Mesh(eyeGeo, glowCyanMat);
    leftEye.position.set(-0.14, 0.05, 0.35);
    const rightEye = new THREE.Mesh(eyeGeo, glowCyanMat);
    rightEye.position.set(0.14, 0.05, 0.35);
    headGroup.add(leftEye);
    headGroup.add(rightEye);

    const jawBar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.05), glowCyanMat);
    jawBar.position.set(0, -0.22, 0.37);
    headGroup.add(jawBar);

    const shoulderGeo = new THREE.SphereGeometry(0.24, 20, 20);
    const leftShoulder = new THREE.Mesh(shoulderGeo, chassisMat);
    leftShoulder.position.set(-0.75, 1.25, 0);
    const rightShoulder = new THREE.Mesh(shoulderGeo, chassisMat);
    rightShoulder.position.set(0.75, 1.25, 0);
    robot.add(leftShoulder);
    robot.add(rightShoulder);

    let mouseX = 0, mouseY = 0;
    let targetHeadX = 0, targetHeadY = 0;
    let isSpeaking = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('touchmove', (e) => {
      if(e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      targetHeadX = mouseX * 0.45;
      targetHeadY = Math.max(-0.25, Math.min(0.35, mouseY * 0.35));
      headGroup.rotation.y += (targetHeadX - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += (-targetHeadY - headGroup.rotation.x) * 0.08;

      robot.position.y = -0.4 + Math.sin(time * 1.8) * 0.03;
      chest.scale.set(1 + Math.sin(time * 1.8) * 0.015, 1, 1 + Math.sin(time * 1.8) * 0.015);

      if (isSpeaking) {
        jawBar.scale.y = 1 + Math.sin(time * 28) * 0.6;
        arcCore.material.color.setHex(0x38bdf8);
      } else {
        jawBar.scale.set(1, 1, 1);
        arcCore.material.color.setHex(0x00f2fe);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ========================================================
       2. SPEECH SYNTHESIS
    ======================================================== */
    const dialogueBox = document.getElementById('dialogue-box');

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*_#]/g, '');
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.rate = 1.05;
        utterance.pitch = 0.95;
        utterance.onstart = () => { isSpeaking = true; };
        utterance.onend = () => { isSpeaking = false; };
        utterance.onerror = () => { isSpeaking = false; };
        window.speechSynthesis.speak(utterance);
      }
    }

    // Initial greeting
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const welcome = "Hello Navneet, what do you want?";
        dialogueBox.innerHTML = '<span class="highlight">Hello Navneet</span>, what do you want?';
        speakText(welcome);
      }, 700);
    });

    /* ========================================================
       3. GEMINI AI REAL-TIME BRAIN (LLM API)
    ======================================================== */
    function promptApiKey() {
      const current = localStorage.getItem('AETHERIS_GEMINI_KEY') || '';
      const key = prompt("Enter your free Google Gemini API Key:", current);
      if (key !== null) {
        localStorage.setItem('AETHERIS_GEMINI_KEY', key.trim());
        alert("API Key Saved Successfully!");
      }
    }

    async function callGeminiBrain(userPrompt) {
      const apiKey = localStorage.getItem('AETHERIS_GEMINI_KEY');
      if (!apiKey) {
        promptApiKey();
        return;
      }

      dialogueBox.innerHTML = '<span class="highlight">Thinking...</span> Analyzing neural network.';
      
      const systemInstruction = "You are Aetheris, an ultra-smart, aesthetic 3D futuristic AI humanoid companion built exclusively for Navneet. Speak concisely, smartly, with a touch of wit and coolness in natural conversational Hinglish/English. Keep responses under 2-3 short sentences so it speaks smoothly.";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                role: 'user',
                parts: [{ text: `${systemInstruction}\n\nUser Navneet asks: ${userPrompt}` }]
              }
            ]
          })
        });

        const data = await res.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text.trim();
          dialogueBox.innerText = reply;
          speakText(reply);
        } else {
          dialogueBox.innerText = "Neural connection failed. Please check your Gemini Key.";
        }
      } catch (err) {
        dialogueBox.innerText = "Error contacting Gemini Brain. Check your connection or API key.";
      }
    }

    /* ========================================================
       4. SPEECH RECOGNITION (MIC)
    ======================================================== */
    let recognition = null;
    let isListening = false;
    const micBtn = document.getElementById('mic-btn');
    const waveContainer = document.getElementById('wave-container');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-IN';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        waveContainer.classList.add('active-listening');
        dialogueBox.innerText = "Listening to you, Navneet...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        callGeminiBrain(transcript);
      };

      recognition.onerror = () => { resetMic(); };
      recognition.onend = () => { resetMic(); };
    }

    function toggleMic() {
      if (!recognition) {
        alert("Speech recognition not supported on this browser. Try Chrome!");
        return;
      }
      if (isListening) {
        recognition.stop();
        resetMic();
      } else {
        speakText('');
        recognition.start();
      }
    }

    function resetMic() {
      isListening = false;
      micBtn.classList.remove('listening');
      waveContainer.classList.remove('active-listening');
    }

    function sendText() {
      const input = document.getElementById('user-input');
      const val = input.value.trim();
      if (val) {
        callGeminiBrain(val);
        input.value = '';
      }
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendText();
    });
  </script>
</body>
</html>
